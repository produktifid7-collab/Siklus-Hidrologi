<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulasi Siklus Hidrologi 3D Realistic - Audio Enhanced</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', sans-serif; background-color: #000; color: white; }
        #sim-container, #quiz-container { position: absolute; width: 100%; height: 100%; top: 0; left: 0; transition: opacity 0.5s; }
        #quiz-container { display: none; background: linear-gradient(135deg, #1e3c72, #2a5298); z-index: 10; overflow-y: auto; }
        #ui-overlay { position: absolute; top: 20px; left: 20px; pointer-events: none; text-shadow: 2px 2px 4px #000; }
        h1 { margin: 0; font-size: 24px; color: #00d2ff; }
        #status-box { background: rgba(0,0,0,0.6); padding: 15px; border-radius: 10px; margin-top: 10px; max-width: 320px; border-left: 4px solid #00d2ff; }
        #term-display { font-size: 28px; font-weight: bold; color: #f1c40f; margin-bottom: 5px; }
        #desc-display { font-size: 14px; line-height: 1.4; }
        #transparency-control { position: absolute; top: 200px; left: 20px; pointer-events: auto; background: rgba(0,0,0,0.6); padding: 15px; border-radius: 10px; width: 200px; border-left: 4px solid #f1c40f; }
        #transparency-control label { display: block; margin-bottom: 5px; font-size: 12px; font-weight: bold; }
        #trans-slider { width: 100%; cursor: pointer; }
        .btn { pointer-events: auto; padding: 12px 24px; background: #ff9f43; color: white; border: none; border-radius: 50px; font-size: 16px; font-weight: bold; cursor: pointer; transition: transform 0.2s; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .btn:hover { transform: scale(1.05); background: #e67e22; }
        #btn-quiz { position: absolute; bottom: 30px; right: 30px; }
        #btn-pause { position: absolute; bottom: 85px; right: 30px; background: #e74c3c; }
        #btn-pause:hover { background: #c0392b; }
        #credit-box { position: absolute; bottom: 20px; left: 20px; font-size: 14px; color: rgba(255,255,255,0.7); z-index: 5; pointer-events: auto; background: rgba(0,0,0,0.3); padding: 8px 15px; border-radius: 20px; }
        #credit-box a { color: #00d2ff; text-decoration: none; font-weight: bold; }
        .floating-label { position: absolute; color: white; background: rgba(0,0,0,0.7); padding: 5px 10px; border-radius: 4px; font-size: 12px; font-weight: bold; pointer-events: none; opacity: 0; transition: opacity 0.5s; }
        .quiz-wrapper { max-width: 700px; margin: 50px auto; padding: 20px; text-align: center; }
        .score-box { font-size: 24px; margin-bottom: 20px; background: rgba(255,255,255,0.1); padding: 10px; border-radius: 10px; }
        .question-card { background: rgba(255,255,255,0.95); color: #333; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        .q-text { font-size: 20px; margin-bottom: 20px; font-weight: bold; }
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .opt-btn { padding: 15px; border: 2px solid #ddd; background: white; border-radius: 8px; cursor: pointer; font-size: 16px; transition: all 0.2s; }
        .opt-btn:hover { background: #f0f0f0; border-color: #aaa; }
        .feedback { margin-top: 15px; font-size: 18px; font-weight: bold; height: 30px; }
        .correct { color: #27ae60; } .wrong { color: #c0392b; }
    </style>
</head>
<body>

    <div id="sim-container">
        <div id="ui-overlay">
            <h1>Siklus Hidrologi 3D</h1>
            <div id="status-box">
                <div id="term-display">Menunggu Interaksi...</div>
                <div id="desc-display">Klik layar untuk memulai audio & animasi.</div>
            </div>
        </div>

        <div id="transparency-control">
            <label>Transparansi Gunung: <span id="trans-val">100</span>%</label>
            <input type="range" id="trans-slider" min="10" max="100" value="100">
        </div>

        <div id="credit-box">Credit by: <a href="https://www.instagram.com/hamzahalhusaini76/" target="_blank">Hamzah Al Husaini</a></div>
        
        <div id="lbl-ocean" class="floating-label">Laut (Evaporasi)</div>
        <div id="lbl-trans" class="floating-label">Hutan (Transpirasi)</div>
        <div id="lbl-cloud" class="floating-label">Awan (Kondensasi)</div>
        <div id="lbl-rain" class="floating-label">Hujan (Presipitasi)</div>
        <div id="lbl-runoff" class="floating-label">Runoff (Permukaan)</div>
        <div id="lbl-infil" class="floating-label">Infiltrasi (Bawah Tanah)</div>

        <button id="btn-pause" class="btn">Pause Simulasi</button>
        <button id="btn-quiz" class="btn" onclick="startQuiz()">Mulai Kuis Pengetahuan</button>
    </div>

    <div id="quiz-container">
        <div class="quiz-wrapper">
            <h1>Kuis Siklus Hidrologi</h1>
            <div class="score-box">Skor: <span id="score">0</span></div>
            <div id="quiz-content" class="question-card">
                <div id="q-text" class="q-text">Loading...</div>
                <div id="options" class="options-grid"></div>
                <div id="feedback" class="feedback"></div>
                <button id="next-btn" class="btn" style="margin-top:20px; display:none;" onclick="nextQuestion()">Pertanyaan Selanjutnya</button>
            </div>
            <button class="btn" style="margin-top: 30px; background: transparent; border: 2px solid white;" onclick="backToSim()">Kembali ke Simulasi</button>
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        let scene, camera, renderer, controls;
        let mountainMesh, oceanMesh, sunMesh, riverMesh;
        let clouds = [], rainSystem, steamSystem, transSystem;
        let runoffSystem, infiltrationSystem;
        let cycleTimer = 0;
        const CYCLE_DURATION = 28;
        let isSimulating = true;
        let isPaused = false;
        let audioCtx;

        let soundRain = new Audio('https://assets.mixkit.co/active_storage/sfx/2505/2505-preview.mp3');
        let soundFlow = new Audio('https://assets.mixkit.co/active_storage/sfx/1231/1231-preview.mp3');
        let soundCloud = new Audio('https://assets.mixkit.co/active_storage/sfx/1117/1117-preview.mp3');

        const termDisplay = document.getElementById('term-display');
        const descDisplay = document.getElementById('desc-display');
        const transSlider = document.getElementById('trans-slider');
        const transVal = document.getElementById('trans-val');
        const btnPause = document.getElementById('btn-pause');

        const labels = {
            ocean: document.getElementById('lbl-ocean'),
            trans: document.getElementById('lbl-trans'),
            cloud: document.getElementById('lbl-cloud'),
            rain: document.getElementById('lbl-rain'),
            runoff: document.getElementById('lbl-runoff'),
            infil: document.getElementById('lbl-infil')
        };

        function getTerrainHeight(x, z) {
            const dist = Math.sqrt(x*x + z*z);
            const islandShape = Math.max(0, 100 - dist);
            let h = 0;
            if (dist < 120) {
                h += Math.sin(x * 0.05) * Math.cos(z * 0.05) * 10;
                h += Math.sin(x * 0.1 + 10) * Math.cos(z * 0.15) * 5;
                h += islandShape * 0.8;
            }
            return Math.max(-10, h);
        }

        init();
        animate();

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB);
            scene.fog = new THREE.FogExp2(0x87CEEB, 0.0025);

            camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 1, 1000);
            camera.position.set(0, 80, 180);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.getElementById('sim-container').appendChild(renderer.domElement);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.maxPolarAngle = Math.PI / 2 - 0.05;

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);
            
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(-50, 100, 50);
            scene.add(dirLight);

            createSun();
            createRealisticTerrain();
            createOcean();
            createRiver(); // Tambahkan objek sungai terpisah
            createVegetation();
            createClouds();
            createRain();
            createSteam();
            createRunoffAndInfiltration();

            window.addEventListener('resize', onWindowResize);
            window.addEventListener('click', initAudio, { once: true });

            transSlider.addEventListener('input', (e) => {
                const val = e.target.value;
                transVal.innerText = val;
                mountainMesh.material.opacity = val / 100;
            });

            btnPause.addEventListener('click', (e) => {
                isPaused = !isPaused;
                if (isPaused) {
                    btnPause.innerText = "Play Simulasi";
                    btnPause.style.background = "#2ecc71";
                    stopAllSounds();
                } else {
                    btnPause.innerText = "Pause Simulasi";
                    btnPause.style.background = "#e74c3c";
                }
            });
        }

        // --- MATAHARI 3D BERPIJAR ---
        function createSun() {
            const sunGeometry = new THREE.SphereGeometry(14, 32, 32);
            const sunMaterial = new THREE.MeshStandardMaterial({ 
                color: 0xffdd00, 
                emissive: 0xffaa00, 
                emissiveIntensity: 2 
            });
            sunMesh = new THREE.Mesh(sunGeometry, sunMaterial);
            sunMesh.position.set(100, 120, -100);
            
            // Tambahkan cahaya titik agar matahari menerangi area sekitar secara lokal
            const sunLight = new THREE.PointLight(0xffdfba, 2, 500);
            sunMesh.add(sunLight);
            
            scene.add(sunMesh);
        }

        // --- LAUT BERGELOMBANG ---
        function createOcean() {
            // Geometri ditingkatkan segmennya (128x128) agar gelombang halus
            const geometry = new THREE.PlaneGeometry(1200, 1200, 128, 128);
            const material = new THREE.MeshPhongMaterial({ 
                color: 0x006994, 
                transparent: true, 
                opacity: 0.85,
                shininess: 90,
                specular: 0x111111
            });
            oceanMesh = new THREE.Mesh(geometry, material);
            oceanMesh.rotation.x = -Math.PI / 2;
            oceanMesh.position.y = 3;
            scene.add(oceanMesh);
        }

        // --- SUNGAI DINAMIS ---
        function createRiver() {
            const geometry = new THREE.PlaneGeometry(300, 300, 128, 128);
            const positions = geometry.attributes.position;
            
            // Sembunyikan bagian yang bukan sungai (buat transparan total)
            const alphas = new Float32Array(positions.count);
            for (let i = 0; i < positions.count; i++) {
                const x = positions.getX(i);
                const y = positions.getY(i);
                const h = getTerrainHeight(x, y);
                
                let expectedX = Math.sin(y * 0.08) * 12;
                let distToRiver = Math.abs(x - expectedX);
                
                if (y < 40 && y > -80 && distToRiver < 3.2 && h > 2) {
                    positions.setZ(i, h + 0.3); // Sedikit di atas tanah
                    alphas[i] = 1.0;
                } else {
                    positions.setZ(i, -20); // Buang ke bawah
                    alphas[i] = 0.0;
                }
            }
            geometry.setAttribute('alpha', new THREE.BufferAttribute(alphas, 1));
            
            const material = new THREE.MeshPhongMaterial({ 
                color: 0x00d2ff, 
                transparent: true, 
                opacity: 0.9,
                shininess: 100
            });
            
            riverMesh = new THREE.Mesh(geometry, material);
            riverMesh.rotation.x = -Math.PI / 2;
            scene.add(riverMesh);
        }

        function createRealisticTerrain() {
            const geometry = new THREE.PlaneGeometry(300, 300, 128, 128);
            const count = geometry.attributes.position.count;
            const colors = [];
            for (let i = 0; i < count; i++) {
                const x = geometry.attributes.position.getX(i);
                const y = geometry.attributes.position.getY(i);
                const height = getTerrainHeight(x, y);
                geometry.attributes.position.setZ(i, height);
                
                let color = new THREE.Color();
                if (height > 60) color.set(0xffffff); 
                else if (height > 5) color.set(0x2d8a3e);
                else color.set(0xc2b280);
                colors.push(color.r, color.g, color.b);
            }
            geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
            geometry.computeVertexNormals();
            const material = new THREE.MeshLambertMaterial({ vertexColors: true, side: THREE.DoubleSide, transparent: true, opacity: 1.0 });
            mountainMesh = new THREE.Mesh(geometry, material);
            mountainMesh.rotation.x = -Math.PI / 2;
            scene.add(mountainMesh);
        }

        function createVegetation() {
            const group = new THREE.Group();
            for (let i = 0; i < 150; i++) {
                const a = Math.random() * Math.PI * 2;
                const r = Math.random() * 50 + 20;
                const x = Math.cos(a)*r; const z = Math.sin(a)*r;
                const h = getTerrainHeight(x, z);
                let expectedX = Math.sin(z * 0.08) * 12;
                let isRiver = (z < 40 && z > -80 && Math.abs(x - expectedX) < 5);
                if (h > 10 && h < 55 && !isRiver) {
                    const tree = new THREE.Group();
                    const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 3), new THREE.MeshLambertMaterial({color: 0x8B4513}));
                    trunk.position.y = 1.5;
                    const leaves = new THREE.Mesh(new THREE.ConeGeometry(2, 6, 8), new THREE.MeshLambertMaterial({color: 0x228B22}));
                    leaves.position.y = 5;
                    tree.add(trunk); tree.add(leaves);
                    tree.position.set(x, h, z);
                    group.add(tree);
                }
            }
            scene.add(group);
        }

        function createClouds() {
            for(let i=0; i<15; i++) {
                const cloud = new THREE.Mesh(new THREE.DodecahedronGeometry(1, 0), new THREE.MeshLambertMaterial({ color: 0xffffff, transparent: true, opacity: 0.8 }));
                cloud.position.set(Math.random()*120 - 60, 75, Math.random()*120 - 60);
                cloud.scale.set(10, 5, 10); cloud.userData = { baseScale: 10 };
                scene.add(cloud); clouds.push(cloud);
            }
        }

        function createRain() {
            const geo = new THREE.BufferGeometry();
            const pos = [];
            for(let i=0; i<4000; i++) pos.push(Math.random()*140-70, Math.random()*80+20, Math.random()*140-70);
            geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
            rainSystem = new THREE.Points(geo, new THREE.PointsMaterial({color: 0xdddddd, size: 0.4, transparent: true}));
            rainSystem.visible = false; scene.add(rainSystem);
        }

        function createSteam() {
            steamSystem = new THREE.Points(new THREE.BufferGeometry(), new THREE.PointsMaterial({color: 0xffffff, size: 0.8, transparent: true, opacity: 0.3}));
            const sPos = []; for(let i=0; i<1000; i++) { const a=Math.random()*Math.PI*2; const r=Math.random()*50+60; sPos.push(Math.cos(a)*r, Math.random()*5, Math.sin(a)*r); }
            steamSystem.geometry.setAttribute('position', new THREE.Float32BufferAttribute(sPos, 3));
            steamSystem.visible = false; scene.add(steamSystem);

            transSystem = new THREE.Points(new THREE.BufferGeometry(), new THREE.PointsMaterial({color: 0xccffcc, size: 0.6, transparent: true, opacity: 0.4}));
            const tPos = []; for(let i=0; i<600; i++) { const a=Math.random()*Math.PI*2; const r=Math.random()*40+20; const x=Math.cos(a)*r; const z=Math.sin(a)*r; tPos.push(x, getTerrainHeight(x, z), z); }
            transSystem.geometry.setAttribute('position', new THREE.Float32BufferAttribute(tPos, 3));
            transSystem.visible = false; scene.add(transSystem);
        }

        function createRunoffAndInfiltration() {
            const rGeo = new THREE.BufferGeometry();
            const rPos = [], rVel = [];
            for(let i=0; i<1500; i++) {
                const a = Math.random()*Math.PI*2; const x = Math.cos(a)*50; const z = Math.sin(a)*50;
                rPos.push(x, getTerrainHeight(x, z)+0.5, z);
                rVel.push(Math.cos(a)*0.18, 0, Math.sin(a)*0.18);
            }
            rGeo.setAttribute('position', new THREE.Float32BufferAttribute(rPos, 3));
            rGeo.userData = { velocity: rVel };
            runoffSystem = new THREE.Points(rGeo, new THREE.PointsMaterial({color: 0x00BFFF, size: 1.2}));
            runoffSystem.visible = false; scene.add(runoffSystem);

            const iGeo = new THREE.BufferGeometry();
            const iPos = [], iVel = [];
            for(let i=0; i<1000; i++) {
                const a = Math.random()*Math.PI*2; const x = Math.cos(a)*40; const z = Math.sin(a)*40;
                iPos.push(x, getTerrainHeight(x, z)-2, z);
                iVel.push(Math.cos(a)*0.06, -0.03, Math.sin(a)*0.06);
            }
            iGeo.setAttribute('position', new THREE.Float32BufferAttribute(iPos, 3));
            iGeo.userData = { velocity: iVel };
            infiltrationSystem = new THREE.Points(iGeo, new THREE.PointsMaterial({color: 0x0000FF, size: 0.9, transparent: true, opacity: 0.8}));
            infiltrationSystem.visible = false; scene.add(infiltrationSystem);
        }

        function stopAllSounds() { soundRain.pause(); soundFlow.pause(); soundCloud.pause(); }

        function animate() {
            if(!isSimulating) return;
            requestAnimationFrame(animate);
            
            const time = Date.now() * 0.001;

            // ANIMASI LAUT (OMBAK)
            if (oceanMesh) {
                const pos = oceanMesh.geometry.attributes.position;
                for (let i = 0; i < pos.count; i++) {
                    const x = pos.getX(i);
                    const y = pos.getY(i);
                    const wave = Math.sin(x * 0.05 + time) * 1.5 + Math.cos(y * 0.05 + time * 0.8) * 1.5;
                    pos.setZ(i, wave);
                }
                pos.needsUpdate = true;
            }

            // ANIMASI SUNGAI (MENGALIR)
            if (riverMesh) {
                const rPos = riverMesh.geometry.attributes.position;
                for (let i = 0; i < rPos.count; i++) {
                    const x = rPos.getX(i);
                    const y = rPos.getY(i);
                    let expectedX = Math.sin(y * 0.08) * 12;
                    if (Math.abs(x - expectedX) < 4) {
                        const ripple = Math.sin(y * 0.5 - time * 5) * 0.4;
                        const originalH = getTerrainHeight(x, y);
                        rPos.setZ(i, originalH + 0.4 + ripple);
                    }
                }
                rPos.needsUpdate = true;
            }

            if (!isPaused) {
                cycleTimer += 0.032; if (cycleTimer > CYCLE_DURATION) cycleTimer = 0;
                const t = cycleTimer;
                steamSystem.visible = transSystem.visible = rainSystem.visible = runoffSystem.visible = false;
                infiltrationSystem.visible = false; 
                Object.values(labels).forEach(l => l.style.opacity = 0);

                if (t < 7) {
                    stopAllSounds();
                    termDisplay.innerText = "Evaporasi & Transpirasi";
                    descDisplay.innerText = "Air menguap dari genangan air (Evaporasi) & tumbuhan (Transpirasi) ke atmosfer.";
                    steamSystem.visible = transSystem.visible = true;
                    [steamSystem, transSystem].forEach(sys => {
                        const p = sys.geometry.attributes.position.array;
                        for(let i=1; i<p.length; i+=3) { p[i]+=0.2; if(p[i]>60) p[i]=5; }
                        sys.geometry.attributes.position.needsUpdate = true;
                    });
                    labels.ocean.style.opacity = labels.trans.style.opacity = 1;
                } 
                else if (t < 14) {
                    if(soundCloud.paused) { stopAllSounds(); soundCloud.play().catch(e=>{}); }
                    termDisplay.innerText = "Kondensasi";
                    descDisplay.innerText = "Uap air mendingin dan membentuk awan hingga mencapai titik jenuh.";
                    const p = (t-7)/7;
                    clouds.forEach(c => { 
                        c.scale.setScalar(c.userData.baseScale * (1+p*0.5)); 
                        const g = 1 - p*0.6; c.material.color.setRGB(g,g,g); 
                    });
                    labels.cloud.style.opacity = 1;
                }
                else if (t < 21) {
                    if(soundRain.paused) { stopAllSounds(); soundRain.play().catch(e=>{}); }
                    termDisplay.innerText = "Presipitasi";
                    descDisplay.innerText = "Hujan turun ke permukaan bumi.";
                    rainSystem.visible = true;
                    const p = rainSystem.geometry.attributes.position.array;
                    for(let i=1; i<p.length; i+=3) { p[i]-=2.5; if(p[i]<0) p[i]=85; }
                    rainSystem.geometry.attributes.position.needsUpdate = true;
                    labels.rain.style.opacity = 1;
                }
                else {
                    if(soundFlow.paused) { stopAllSounds(); soundFlow.play().catch(e=>{}); }
                    termDisplay.innerText = "Runoff & Infiltrasi";
                    descDisplay.innerText = "Air mengalir di permukaan (Runoff) & Meresap (Infiltrasi) ke tanah.";
                    runoffSystem.visible = true;
                    infiltrationSystem.visible = (mountainMesh.material.opacity < 1.0);
                    const rP = runoffSystem.geometry.attributes.position.array, rV = runoffSystem.geometry.userData.velocity;
                    for(let i=0; i<rP.length/3; i++){
                        const idx=i*3; rP[idx]+=rV[idx]; rP[idx+2]+=rV[idx+2];
                        const h = getTerrainHeight(rP[idx], rP[idx+2]);
                        if(h < 4) { rP[idx]=Math.random()*30-15; rP[idx+2]=Math.random()*30-15; }
                        rP[idx+1] = h+0.6;
                    }
                    runoffSystem.geometry.attributes.position.needsUpdate = true;
                    labels.runoff.style.opacity = labels.infil.style.opacity = 1;
                }
            }

            updateLabelsPosition(); 
            controls.update(); 
            renderer.render(scene, camera);
        }

        function updateLabelsPosition() {
            const updateLbl = (v3, el) => {
                const v = v3.clone().project(camera);
                el.style.left = `${(v.x * .5 + .5) * window.innerWidth}px`;
                el.style.top = `${(-(v.y * .5) + .5) * window.innerHeight}px`;
            };
            updateLbl(new THREE.Vector3(80, 5, 80), labels.ocean);
            updateLbl(new THREE.Vector3(30, 20, 30), labels.trans);
            updateLbl(new THREE.Vector3(0, 80, 0), labels.cloud);
            updateLbl(new THREE.Vector3(0, 40, 0), labels.rain);
            updateLbl(new THREE.Vector3(45, 12, 0), labels.runoff);
            updateLbl(new THREE.Vector3(-15, -8, -15), labels.infil);
        }

        function onWindowResize() { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); }
        function initAudio() { if(!audioCtx) audioCtx = new AudioContext(); }

        const questions = [
            { q: "Apa proses penguapan air dari laut?", opts: ["Infiltrasi", "Evaporasi", "Kondensasi", "Presipitasi"], a: 1 },
            { q: "Proses penguapan air melalui tumbuhan disebut?", opts: ["Transpirasi", "Sublimasi", "Runoff", "Adveksi"], a: 0 },
            { q: "Perubahan uap air menjadi awan disebut?", opts: ["Presipitasi", "Kondensasi", "Evaporasi", "Infiltrasi"], a: 1 },
            { q: "Jatuhnya titik-titik air ke bumi disebut?", opts: ["Kondensasi", "Presipitasi", "Transpirasi", "Runoff"], a: 1 },
            { q: "Air yang meresap ke dalam pori-pori tanah disebut?", opts: ["Runoff", "Kondensasi", "Infiltrasi", "Sublimasi"], a: 2 },
            { q: "Air yang mengalir di atas permukaan tanah disebut?", opts: ["Infiltrasi", "Runoff", "Evaporasi", "Adveksi"], a: 1 },
            { q: "Sumber energi utama siklus hidrologi adalah?", opts: ["Bulan", "Angin", "Matahari", "Gravitasi"], a: 2 },
            { q: "Awan bergerak ditiup angin ke daratan disebut?", opts: ["Adveksi", "Infiltrasi", "Kondensasi", "Transpirasi"], a: 0 },
            { q: "Lapisan tanah yang menyimpan air disebut?", opts: ["Atmosfer", "Akuifer", "Biosfer", "Litosfer"], a: 1 },
            { q: "Siklus air terjadi secara?", opts: ["Berhenti", "Berulang/Terus-menerus", "Satu kali", "Lambat"], a: 1 }
        ];
        let currentQ = 0, score = 0;
        window.startQuiz = function() { stopAllSounds(); document.getElementById('sim-container').style.display='none'; document.getElementById('quiz-container').style.display='block'; isSimulating=false; currentQ=0; score=0; document.getElementById('score').innerText=score; loadQuestion(); };
        function loadQuestion() { const q=questions[currentQ]; document.getElementById('q-text').innerText=(currentQ+1)+". "+q.q; const opts=document.getElementById('options'); opts.innerHTML=''; document.getElementById('feedback').innerText=''; document.getElementById('next-btn').style.display='none'; q.opts.forEach((o,i)=>{const b=document.createElement('div'); b.className='opt-btn'; b.innerText=o; b.onclick=()=>checkAnswer(i,b); opts.appendChild(b);}); }
        function checkAnswer(idx, btn) { const q=questions[currentQ]; const allBtns=document.querySelectorAll('.opt-btn'); allBtns.forEach(b=>b.onclick=null); if(idx===q.a){score+=10; document.getElementById('score').innerText=score; btn.style.background="#27ae60"; btn.style.color="white"; document.getElementById('feedback').innerText="BENAR! +10 Poin"; document.getElementById('feedback').className="feedback correct";} else {btn.style.background="#c0392b"; btn.style.color="white"; allBtns[q.a].style.background="#27ae60"; allBtns[q.a].style.color="white"; document.getElementById('feedback').innerText="SALAH!"; document.getElementById('feedback').className="feedback wrong";} if(currentQ<questions.length-1) document.getElementById('next-btn').style.display='inline-block'; else document.getElementById('feedback').innerText+=" - SELESAI!"; }
        window.nextQuestion = function() { currentQ++; loadQuestion(); };
        window.backToSim = function() { document.getElementById('quiz-container').style.display='none'; document.getElementById('sim-container').style.display='block'; isSimulating=true; animate(); };
    </script>
</body>
</html>
